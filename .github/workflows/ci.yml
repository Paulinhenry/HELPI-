name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Tests (Node.js)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './helpi-backend/package-lock.json'
          
      - name: Instalar Dependências (Backend)
        working-directory: ./helpi-backend
        run: npm install
        
      - name: Executar Testes Unitários
        working-directory: ./helpi-backend
        env:
          JWT_SECRET: key_super_secreta_para_github_actions
          PORT: 3000
          NODE_ENV: test
        # Rodamos apenas testes unitários porque os de integração exigem base de dados e não há migrações no projeto
        run: npm run test:unit

  flutter-cliente:
    name: Testes Flutter (App Cliente)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Instalar Dependências (Cliente)
        working-directory: ./helpi
        run: flutter pub get
        
      - name: Executar Testes (Cliente)
        working-directory: ./helpi
        run: flutter test

  flutter-profissional:
    name: Testes Flutter (App Profissional)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Instalar Dependências (Profissional)
        working-directory: ./helpi_profissional
        run: flutter pub get
        
      - name: Executar Testes (Profissional)
        working-directory: ./helpi_profissional
        run: flutter test
