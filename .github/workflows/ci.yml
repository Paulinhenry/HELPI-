name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-tests:
    name: Backend Tests (Node.js & PostgreSQL)
    runs-on: ubuntu-latest
    
    # Serviços de fundo, necessários para os testes de integração (FSM, etc)
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: helpi
          POSTGRES_PASSWORD: password123
          POSTGRES_DB: helpi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './helpi-backend/package-lock.json'
          
      - name: Instalar Dependências (Backend)
        working-directory: ./helpi-backend
        # npm install é mais permissivo caso o package-lock esteja desatualizado
        run: npm install
        
      - name: Rodar Migrations de Banco de Dados
        working-directory: ./helpi-backend
        env:
          DATABASE_URL: postgresql://helpi:password123@localhost:5432/helpi_test
          NODE_ENV: test
        run: npm run migrate
        
      - name: Executar Testes com Cobertura
        working-directory: ./helpi-backend
        env:
          DATABASE_URL: postgresql://helpi:password123@localhost:5432/helpi_test
          JWT_SECRET: key_super_secreta_para_github_actions
          PORT: 3000
          NODE_ENV: test
        run: npm run test:all

  flutter-cliente:
    name: Testes Flutter (App Cliente)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Instalar Dependências (Cliente)
        working-directory: ./helpi
        run: flutter pub get
        
      - name: Executar Testes (Cliente)
        working-directory: ./helpi
        run: flutter test

  flutter-profissional:
    name: Testes Flutter (App Profissional)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Instalar Dependências (Profissional)
        working-directory: ./helpi_profissional
        run: flutter pub get
        
      - name: Executar Testes (Profissional)
        working-directory: ./helpi_profissional
        run: flutter test
