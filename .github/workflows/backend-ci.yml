name: Backend CI/CD

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'helpi-backend/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'helpi-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./helpi-backend

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './helpi-backend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: npm test

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    defaults:
      run:
        working-directory: ./helpi-backend
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: docker build -t helpi/backend:latest .
      
    # Deploy step could go here (e.g. AWS ECR, DigitalOcean, Heroku)
