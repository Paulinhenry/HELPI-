name: Backend CI/CD

on:
  push:
    branches: [ "main", "master" ]
    paths:
      - 'helpi-backend/**'
  pull_request:
    branches: [ "main", "master" ]
    paths:
      - 'helpi-backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: helpi_user
          POSTGRES_PASSWORD: senha_segura
          POSTGRES_DB: helpi_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://helpi_user:senha_segura@localhost:5432/helpi_db?sslmode=disable
      DB_SSL: false
      JWT_SECRET: secret_ci_test
      JWT_REFRESH_SECRET: refresh_secret_ci_test
      NODE_ENV: test
      PORT: 3000
      MP_ACCESS_TOKEN: dummy_token_for_tests_ci

    defaults:
      run:
        working-directory: ./helpi-backend

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v3
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: './helpi-backend/package-lock.json'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run DB Setup Scripts
      run: |
        node src/scripts/initDb.js
        node src/scripts/initDbexpress.js
        node src/scripts/initDbavaliacoes.js
        node src/scripts/atualizar_avaliacoes.js
        node src/scripts/upgradePostGIS.js
        node src/scripts/migrateSoftDeleteAndIndexes.js

    - name: Run tests
      run: npm run test:all

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    
    defaults:
      run:
        working-directory: ./helpi-backend
        
    steps:
    - uses: actions/checkout@v3
    
    - name: Build Docker image
      run: docker build -t helpi/backend:latest .
      
    # Deploy step could go here (e.g. AWS ECR, DigitalOcean, Heroku)
